<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="url(#bgGrad)" rx="16"/>
  <rect width="1198" height="618" x="1" y="1" fill="none" stroke="#E2E8F0" stroke-width="2" rx="15"/>

  <!-- Title Header -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Four Integrated Business Intelligence Projects</text>
  <text x="50" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B">Proven evidence-driven analytics across retail merchandising, dimensional modeling, customer retention, and finance</text>

  <!-- Quadrant 1: Superstore EDA -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="110" width="530" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="50" y="110" width="530" height="6" fill="#2563EB" rx="3"/>
    <text x="75" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1">PROJECT 1 • RETAIL MERCHANDISING EDA</text>
    <text x="75" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Superstore Sales &amp; Margin Elasticity</text>
    
    <text x="75" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Total Sales: <tspan font-weight="800" fill="#0F172A">$2,297,201</tspan> | Net Profit: <tspan font-weight="800" fill="#059669">$286,397</tspan> (12.47% Margin)</text>
    <text x="75" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• The 20% Discount Cliff: Discounts &gt;20% caused <tspan font-weight="800" fill="#DC2626">-$64,346 in lost profit</tspan></text>
    <text x="75" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Sub-Category Loss Leaders: Tables (<tspan font-weight="800" fill="#DC2626">-$17,725</tspan>) and Bookcases (<tspan font-weight="800" fill="#DC2626">-$3,473</tspan>)</text>
    <text x="75" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Seasonality: Q4 (Nov/Dec) drives 31.4% of annual revenue and 33.8% of profit</text>
    
    <rect x="75" y="305" width="130" height="22" rx="4" fill="#EFF6FF"/>
    <text x="140" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8" text-anchor="middle">7 Exported Charts</text>
    <rect x="215" y="305" width="170" height="22" rx="4" fill="#F1F5F9"/>
    <text x="300" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">5 Executive Findings</text>
  </g>

  <!-- Quadrant 2: Power BI Star Schema -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="110" width="530" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="620" y="110" width="530" height="6" fill="#059669" rx="3"/>
    <text x="645" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="1">PROJECT 2 • ENTERPRISE POWER BI DASHBOARD</text>
    <text x="645" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Star Schema &amp; Time-Intelligence DAX</text>
    
    <text x="645" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Dimensional Modeling: <tspan font-weight="800" fill="#0F172A">FactSales</tspan> (9,994 rows) + 4 Conformed Dimensions</text>
    <text x="645" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Continuous Calendar: <tspan font-weight="800" fill="#059669">DimDate</tspan> spanning 1,826 days (2014-2018) for YoY DAX</text>
    <text x="645" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• 4 Dashboard Pages: Executive, Product Profitability, Customers, Trends</text>
    <text x="645" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Reconciliation: <tspan font-weight="800" fill="#059669">$0.00 Variance</tspan> between Python totals &amp; Power BI model</text>
    
    <rect x="645" y="305" width="145" height="22" rx="4" fill="#ECFDF5"/>
    <text x="717" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Production DAX File</text>
    <rect x="800" y="305" width="165" height="22" rx="4" fill="#F1F5F9"/>
    <text x="882" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Full Wireframe Spec</text>
  </g>

  <!-- Quadrant 3: Telco Cohorts -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="360" width="530" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="50" y="360" width="530" height="6" fill="#D97706" rx="3"/>
    <text x="75" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#D97706" letter-spacing="1">PROJECT 3 • CUSTOMER RETENTION &amp; CHURN</text>
    <text x="75" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Tenure Cohorts &amp; Retention Playbooks</text>
    
    <text x="75" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Baseline Churn: <tspan font-weight="800" fill="#DC2626">26.54%</tspan> (1,869 accounts), exposing <tspan font-weight="800" fill="#DC2626">$139,131 MRR</tspan></text>
    <text x="75" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Contract Vulnerability: Month-to-month contracts churn at <tspan font-weight="800" fill="#DC2626">42.71%</tspan> (15.1x risk)</text>
    <text x="75" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Onboarding Cliff: 0–12m cohort accounts for 55.5% of total portfolio churn</text>
    <text x="75" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Commercial ROI: 3 Retention initiatives deliver <tspan font-weight="800" fill="#059669">+$251,300 net ARR</tspan></text>
    
    <rect x="75" y="555" width="140" height="22" rx="4" fill="#FFFBEB"/>
    <text x="145" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">5 Cohort Visuals</text>
    <rect x="225" y="555" width="180" height="22" rx="4" fill="#F1F5F9"/>
    <text x="315" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Causality Controls Audit</text>
  </g>

  <!-- Quadrant 4: Corporate Finance -->
  <g filter="url(#cardShadow)">
    <rect x="620" y="360" width="530" height="230" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="620" y="360" width="530" height="6" fill="#7C3AED" rx="3"/>
    <text x="645" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" letter-spacing="1">PROJECT 4 • CORPORATE FINANCIAL INTELLIGENCE</text>
    <text x="645" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Margin Decomposition &amp; What-If Scenarios</text>
    
    <text x="645" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Full Statement: Gross <tspan font-weight="800" fill="#0F172A">$127.93M</tspan> -&gt; Net <tspan font-weight="800" fill="#0F172A">$118.73M</tspan> -&gt; Profit <tspan font-weight="800" fill="#059669">$16.89M</tspan></text>
    <text x="645" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Enterprise Deficit: Enterprise segment lost <tspan font-weight="800" fill="#DC2626">-$616,900</tspan> (103.2% COGS)</text>
    <text x="645" y="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Government Engine: Delivered $11.39M profit (67.4% of corporate profit)</text>
    <text x="645" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#475569">• Dynamic What-If: Power BI parameter sliders for Discount &amp; COGS shifts</text>
    
    <rect x="645" y="555" width="145" height="22" rx="4" fill="#F5F3FF"/>
    <text x="717" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6D28D9" text-anchor="middle">Income Waterfall</text>
    <rect x="800" y="555" width="175" height="22" rx="4" fill="#F1F5F9"/>
    <text x="887" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Sensitivity Tornado Matrix</text>
  </g>
</svg>